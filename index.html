<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujian CBT Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --primary-grad: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); --bg-color: #f1f5f9; --text-dark: #0f172a; --text-muted: #64748b; --border: #e2e8f0; --card-bg: rgba(255, 255, 255, 0.95); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-dark); min-height: 100vh; overflow-x: hidden; display: flex; align-items: center; justify-content: center; padding: 15px; }
        .bg-wave { position: fixed; top: 0; left: 0; width: 100%; height: 35vh; background: var(--primary-grad); z-index: -1; border-bottom-left-radius: 50% 15%; border-bottom-right-radius: 50% 15%; }
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--card-bg); padding: 35px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); width: 100%; max-width: 420px; }
        h1, h2 { text-align: center; color: var(--text-dark); margin-bottom: 8px; font-weight: 700; }
        p.subtitle { color: var(--text-muted); font-size: 14px; text-align: center; margin-bottom: 25px; }

        input { width: 100%; padding: 16px; border: 2px solid var(--border); border-radius: 12px; font-size: 15px; margin-bottom: 15px; background: #f8fafc; transition: 0.3s; }
        input:focus { outline: none; border-color: var(--primary); background: white; box-shadow: 0 0 0 4px rgba(37,99,235,0.1); }
        button { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-primary { background: var(--primary-grad); color: white; }
        .btn-primary:active { transform: scale(0.98); }
        .btn-success { background: #10b981; color: white; }
        .btn-danger { background: #ef4444; color: white; margin-top: 20px; }

        /* PERUBAHAN LAYOUT: Navigasi di atas pada HP */
        .exam-layout { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 1100px; margin-top: 10px; }
        @media (min-width: 850px) { .exam-layout { flex-direction: row-reverse; align-items: flex-start; } } /* Di laptop Nav tetap di kanan */
        
        .panel { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
        .panel-soal { flex: 1; }
        .panel-nav { width: 100%; }
        @media (min-width: 850px) { .panel-nav { width: 340px; position: sticky; top: 20px; } }

        .header-soal { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        .badge-soal { background: #e0e7ff; color: #4338ca; padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 14px; }
        .teks-soal { font-size: 17px; line-height: 1.6; margin-bottom: 25px; white-space: pre-wrap; font-weight: 500;}
        
        .opsi-item { display: flex; align-items: center; gap: 15px; padding: 15px; border: 2px solid var(--border); border-radius: 12px; cursor: pointer; margin-bottom: 10px; background: white; }
        .opsi-item input { display: none; }
        .radio-circle { width: 30px; height: 30px; min-width: 30px; border-radius: 50%; border: 2px solid #cbd5e1; display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--text-muted); }
        .opsi-item.selected { border-color: var(--primary); background: #eff6ff; }
        .opsi-item.selected .radio-circle { background: var(--primary); border-color: var(--primary); color: white; }

        .nav-bawah { display: flex; justify-content: space-between; margin-top: 30px; gap: 10px; }
        .btn-prev { background: white; color: var(--text-dark); border: 2px solid var(--border); width: 48%; }
        .btn-next-action { width: 48%; }

        .grid-title { font-weight: 700; text-align: center; margin-bottom: 15px; font-size: 15px; }
        .grid-soal { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .btn-nomor { aspect-ratio: 1; border-radius: 8px; border: 2px solid #fef08a; background: #fef9c3; color: #a16207; font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;}
        .btn-nomor.dijawab { background: #10b981; border-color: #059669; color: white; }
        .btn-nomor.aktif { border-color: var(--primary); transform: scale(1.1); z-index: 10; box-shadow: 0 0 0 3px rgba(37,99,235,0.2);}

        .info-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; padding-bottom: 10px; border-bottom: 1px dashed var(--border); }
        .overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .loader-card { background: white; padding: 30px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="bg-wave"></div>

    <div id="loadingScreen" class="overlay hidden">
        <div class="loader-card">
            <div class="spinner"></div>
            <div style="font-weight: 600;">Memproses Data...</div>
        </div>
    </div>

    <!-- 1. LOGIN -->
    <div id="loginSection" class="card fade-in">
        <h1>Portal CBT</h1>
        <p class="subtitle">Masuk menggunakan akun Anda</p>
        <input type="text" id="username" placeholder="NIS / Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="doLogin()" class="btn-primary">Masuk Sekarang</button>
    </div>

    <!-- 2. TOKEN -->
    <div id="tokenSection" class="card hidden fade-in">
        <h2 id="displayNama" style="color: var(--primary); font-size: 20px; margin-bottom: 20px;"></h2>
        <p class="subtitle">Minta Token kepada Pengawas Ruangan.</p>
        <input type="text" id="token" placeholder="KETIK TOKEN" style="text-align: center; font-size: 24px; font-weight: 700; text-transform: uppercase;">
        <button onclick="doVerifyToken()" class="btn-primary">Validasi Token</button>
    </div>

    <!-- 3. KONFIRMASI -->
    <div id="confirmSection" class="card hidden fade-in">
        <h2>Konfirmasi Data</h2>
        <div style="background: #f8fafc; border-radius: 12px; padding: 15px; margin: 20px 0; border: 1px solid var(--border);">
            <div class="info-row"><span style="color:var(--text-muted)">Nama</span><span id="confNama" style="font-weight:600"></span></div>
            <div class="info-row"><span style="color:var(--text-muted)">NIS</span><span id="confNis" style="font-weight:600"></span></div>
            <div class="info-row" style="border:none; padding:0; margin:0;"><span style="color:var(--text-muted)">Mapel</span><span id="confMapelDetail" style="font-weight:700; color:var(--primary)"></span></div>
        </div>
        <button onclick="startExam()" class="btn-primary">Mulai Kerjakan Ujian</button>
    </div>

    <!-- 4. UJIAN -->
    <div id="examSection" class="exam-layout hidden fade-in">
        
        <!-- NAVIGASI KINI DI ATAS (di HP) -->
        <div class="panel panel-nav">
            <div class="grid-title">NAVIGASI SOAL</div>
            <div class="grid-soal" id="gridNavigasi"></div>
            <button onclick="submitExam()" class="btn-danger">SELESAIKAN UJIAN</button>
        </div>

        <!-- SOAL -->
        <div class="panel panel-soal">
            <div class="header-soal">
                <div class="badge-soal" id="nomorSoalTitle">SOAL 1</div>
                <div style="font-size: 14px; font-weight: 600; color: var(--text-muted);" id="progressText"></div>
            </div>
            <div class="teks-soal" id="pertanyaanTeks"></div>
            <div class="opsi-list" id="opsiContainer"></div>
            
            <div class="nav-bawah">
                <button onclick="prevSoal()" class="btn-prev">← Sebelumnya</button>
                <button id="btnNextAction" onclick="nextSoal()" class="btn-primary btn-next-action">Selanjutnya →</button>
            </div>
        </div>
    </div>

    <!-- 5. SELESAI -->
    <div id="finishSection" class="card hidden fade-in" style="text-align: center;">
        <h2 style="color: #10b981; font-size: 28px;">Ujian Selesai!</h2>
        <p class="subtitle" style="margin-top: 15px;">Jawaban Anda telah tersimpan. Anda tidak dapat login kembali ke ujian ini.</p>
        <button onclick="window.location.reload()" class="btn-prev" style="width:100%; border:none; background:#e2e8f0">Kembali ke Awal</button>
    </div>

    <script>
        // =========================================================
        const API_URL = 'https://script.google.com/macros/s/AKfycbwKlOO_iTbieOG5nYx_FJz2DOyEHy4U1Va-LkkpVMlf04d1jWgtLjWFgudF3KQ0Oq39/exec'; 
        // =========================================================
        
        let state = { user: null, questions: [], answers: {}, currentIndex: 0 };

        const show = (id) => { 
            document.getElementById(id).classList.remove('hidden');
            if(id === 'examSection' || id === 'finishSection') document.querySelector('.bg-wave').style.display = 'none';
        };
        const hide = (id) => document.getElementById(id).classList.add('hidden');
        const loading = (isLoading) => isLoading ? document.getElementById('loadingScreen').classList.remove('hidden') : document.getElementById('loadingScreen').classList.add('hidden');

        // FITUR ACAK SOAL
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        async function doLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if(!u || !p) return alert('Wajib diisi!');
            loading(true);
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', username: u, password: p }), headers: { 'Content-Type': 'text/plain' } });
                const data = await res.json();
                if(data.status === 'success') {
                    state.user = data.user; document.getElementById('displayNama').innerText = state.user.nama;
                    hide('loginSection'); show('tokenSection');
                } else { alert(data.message); }
            } catch (err) { alert('Gagal server.'); }
            loading(false);
        }

        async function doVerifyToken() {
            const t = document.getElementById('token').value;
            if(!t) return alert('Isi token!');
            loading(true);
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'verifyToken', username: document.getElementById('username').value, token: t }), headers: { 'Content-Type': 'text/plain' } });
                const data = await res.json();
                if(data.status === 'success') {
                    state.questions = data.questions; 
                    shuffleArray(state.questions); // PANGGIL FITUR ACAK SOAL DI SINI
                    state.user.mapel = data.mapel; 
                    document.getElementById('confNama').innerText = state.user.nama;
                    document.getElementById('confNis').innerText = state.user.nis;
                    document.getElementById('confMapelDetail').innerText = state.user.mapel.toUpperCase();
                    hide('tokenSection'); show('confirmSection');
                } else { alert(data.message); }
            } catch (err) { alert('Gagal Token.'); }
            loading(false);
        }

        function startExam() { hide('confirmSection'); show('examSection'); renderNavigasi(); loadSoal(0); }

        function loadSoal(index) {
            state.currentIndex = index; const soal = state.questions[index];
            document.getElementById('nomorSoalTitle').innerText = `SOAL ${index + 1}`;
            document.getElementById('progressText').innerText = `${index + 1} dari ${state.questions.length}`;
            document.getElementById('pertanyaanTeks').innerText = soal.pertanyaan;
            
            const opsiContainer = document.getElementById('opsiContainer'); opsiContainer.innerHTML = '';
            ['A', 'B', 'C', 'D', 'E'].forEach(h => {
                const teksOpsi = soal.opsi[h];
                if(teksOpsi) {
                    const isChecked = state.answers[soal.no] === h;
                    opsiContainer.innerHTML += `
                        <label class="opsi-item ${isChecked ? 'selected' : ''}">
                            <input type="radio" name="jawaban" value="${h}" onchange="pilihJawaban('${soal.no}', '${h}')" ${isChecked ? 'checked' : ''}>
                            <div class="radio-circle">${h}</div>
                            <div style="font-weight: 500; font-size: 15px;">${teksOpsi}</div>
                        </label>
                    `;
                }
            });

            // LOGUCA TOMBOL BERUBAH DI NOMOR TERAKHIR
            const btnNext = document.getElementById('btnNextAction');
            if(index === state.questions.length - 1) {
                btnNext.innerText = "Selesai ✓";
                btnNext.className = "btn-primary btn-next-action btn-success"; // Ubah jadi hijau
                btnNext.onclick = submitExam;
            } else {
                btnNext.innerText = "Selanjutnya →";
                btnNext.className = "btn-primary btn-next-action"; // Kembalikan ke biru
                btnNext.onclick = nextSoal;
            }

            updateGridSelection();
        }

        function pilihJawaban(noSoal, jawaban) { state.answers[noSoal] = jawaban; loadSoal(state.currentIndex); renderNavigasi(); }
        function nextSoal() { if(state.currentIndex < state.questions.length - 1) loadSoal(state.currentIndex + 1); }
        function prevSoal() { if(state.currentIndex > 0) loadSoal(state.currentIndex - 1); }

        function renderNavigasi() {
            const grid = document.getElementById('gridNavigasi'); grid.innerHTML = '';
            state.questions.forEach((q, index) => {
                const isDijawab = state.answers[q.no];
                grid.innerHTML += `<button onclick="loadSoal(${index})" id="navBtn-${index}" class="btn-nomor ${isDijawab ? 'dijawab' : ''}">${index + 1}</button>`;
            });
            updateGridSelection();
        }

        function updateGridSelection() {
            state.questions.forEach((q, idx) => {
                const btn = document.getElementById(`navBtn-${idx}`);
                if(btn) { idx === state.currentIndex ? btn.classList.add('aktif') : btn.classList.remove('aktif'); }
            });
        }

        async function submitExam() {
            const totalDijawab = Object.keys(state.answers).length;
            const belumDijawab = state.questions.length - totalDijawab;
            let pesan = belumDijawab > 0 ? `Masih ada ${belumDijawab} soal KOSONG!\nYakin SELESAIKAN?` : "Yakin ingin menyelesaikan ujian?";
            if(!confirm(pesan)) return;

            loading(true);
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'submitExam', user: state.user, answers: state.answers }), headers: { 'Content-Type': 'text/plain' } });
                const data = await res.json();
                if(data.status === 'success') { hide('examSection'); show('finishSection'); } else { alert('Gagal!'); }
            } catch (err) { alert('Terjadi kesalahan.'); }
            loading(false);
        }
    </script>
</body>
</html>
